name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check
        run: cargo check --workspace --all-targets

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --all-targets --lib
      - name: Test with features
        run: cargo test --workspace --all-targets --features "full"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: snex_test
          POSTGRES_USER: snex
          POSTGRES_PASSWORD: snex
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U snex -d snex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Run migrations
        run: |
          sqlx migrate run --database-url postgresql://snex:snex@localhost:5432/snex_test
        env:
          DATABASE_URL: postgresql://snex:snex@localhost:5432/snex_test
      - name: Run integration tests
        run: cargo test --workspace --all-targets --test integration
        env:
          DATABASE_URL: postgresql://snex:snex@localhost:5432/snex_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --workspace --release --all-targets
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: snex-binaries
          path: |
            target/release/snex-api
            target/release/snex-issuer
            target/release/snex-verifier
            target/release/snex-registry
            target/release/snex-reporting
            target/release/snex-voting
            target/release/snex-levelc
            target/release/snex-anchoring
            target/release/snex-retention
            target/release/snex-tenant
            target/release/snex-cli
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f Dockerfile.api -t snex-api .
          docker build -f Dockerfile.issuer -t snex-issuer .
          docker build -f Dockerfile.verifier -t snex-verifier .
          docker build -f Dockerfile.registry -t snex-registry .
          docker build -f Dockerfile.anchoring -t snex-anchoring .
          docker build -f Dockerfile.retention -t snex-retention .
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        run: |
          docker tag snex-api ghcr.io/${{ github.repository }}/snex-api:${{ github.sha }}
          docker tag snex-issuer ghcr.io/${{ github.repository }}/snex-issuer:${{ github.sha }}
          docker tag snex-verifier ghcr.io/${{ github.repository }}/snex-verifier:${{ github.sha }}
          docker tag snex-registry ghcr.io/${{ github.repository }}/snex-registry:${{ github.sha }}
          docker tag snex-anchoring ghcr.io/${{ github.repository }}/snex-anchoring:${{ github.sha }}
          docker tag snex-retention ghcr.io/${{ github.repository }}/snex-retention:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-issuer:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-verifier:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-registry:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-anchoring:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/snex-retention:${{ github.sha }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo generate-lockfile && cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-deny
        run: cargo deny check --all-features

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SBOM
        run: cargo sbom > sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30