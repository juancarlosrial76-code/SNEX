[package]
name = "snex-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "SNEX CLI: command-line interface for SNEX"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
snex-client = { path = "../snex-client" }
snex-crypto = { path = "../snex-crypto" }
snex-core = { path = "../snex-core" }