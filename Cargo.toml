[package]
name = "snex"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SNEX - A Rust CLI application"
repository = "https://github.com/yourusername/snex"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_toml = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
config = "0.14"
num_cpus = "1.16"
toml = "0.8"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "snex"
path = "src/main.rs"